# cargo-deny: license and advisory checks (`cargo deny check`).
[graph]
all-features = false

[advisories]
# Unmaintained crates deep in GPUI's tree are reported but don't fail the build.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # webpki-roots (Mozilla CA list, used by the update check).
    "CDLA-Permissive-2.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
